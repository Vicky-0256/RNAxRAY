name: Desktop app (MyGo, Windows, Linux, macOS)

on:
  pull_request:
    paths:
      - "desktop/app/**"
      - "desktop/runtime/**"
      - "pipeline/rnaxrayanalysis/**"
      - ".github/workflows/desktop-native.yml"
  workflow_dispatch:

permissions:
  contents: read

# The native shell (desktop/app) must build, vet and pass its tests on every
# desktop target: core against the real Python bridge, the views headless.
jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows/amd64
          - os: ubuntu-22.04
            platform: linux/amd64
          - os: macos-14
            platform: darwin/arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: desktop/app
    env:
      CGO_ENABLED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/app/go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install the desktop runtime packages
        working-directory: .
        run: 'python -m pip install --only-binary=:all: -r desktop/runtime/requirements-native.txt'
      - name: Acquire pinned Bowtie2
        working-directory: .
        run: python desktop/scripts/acquire-bowtie2.py --platform "$(echo '${{ matrix.platform }}' | sed 's#windows/amd64#windows-x86_64#; s#linux/amd64#linux-x86_64#; s#darwin/arm64#macos-aarch64#')" --output "$RUNNER_TEMP/bowtie2"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: MyGo vet
        run: go tool mygo vet .
      - name: Tests
        env:
          RNAXRAYPIPE_TOOL_DIR: ${{ runner.temp }}/bowtie2/bin
        run: go test ./...
      - name: Package (without the bundled runtime)
        run: go tool mygo build -platform ${{ matrix.platform }} -skip-dmg
